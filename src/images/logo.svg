<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- PocketBook mark: open book + bookmark, designed to read at 1-bit on e-ink -->
  <!-- book base / cover edge -->
  <polygon points="13,82 107,82 102,90 18,90" fill="black"/>
  <!-- left + right pages (black outline) -->
  <polygon points="60,44 17,38 13,82 60,86" fill="black"/>
  <polygon points="60,44 103,38 107,82 60,86" fill="black"/>
  <!-- white page surfaces -->
  <polygon points="56,49 23,44 20,78 56,80" fill="white"/>
  <polygon points="64,49 97,44 100,78 64,80" fill="white"/>
  <!-- spine -->
  <line x1="60" y1="44" x2="60" y2="86" stroke="black" stroke-width="3"/>
  <!-- text lines -->
  <g stroke="black" stroke-width="2">
    <line x1="26" y1="53" x2="53" y2="55"/><line x1="26" y1="60" x2="53" y2="62"/>
    <line x1="26" y1="67" x2="53" y2="69"/><line x1="26" y1="74" x2="53" y2="75"/>
    <line x1="67" y1="55" x2="94" y2="53"/><line x1="67" y1="62" x2="94" y2="60"/>
    <line x1="67" y1="69" x2="94" y2="67"/><line x1="67" y1="75" x2="94" y2="74"/>
  </g>
  <!-- bookmark ribbon -->
  <polygon points="66,18 80,18 80,58 73,51 66,58" fill="black"/>
</svg>
